[project]
name = "obs-tool"
version = "0.1.0"
description = "Lightweight observability layer for a warehouse pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "pyyaml",
    "sqlalchemy>=2",
    "psycopg[binary]",
    "apscheduler",
    "dotenv>=0.9.9",
]

[project.optional-dependencies]
sqlserver = ["pyodbc"]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/obs_tool"]

[tool.ruff]
line-length = 100
